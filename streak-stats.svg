<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="isolation:isolate" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <clipPath id="cr"><rect width="495" height="195" rx="6"/></clipPath>
    <linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#cr)">
    <!-- Background -->
    <rect fill="#0D1117" width="495" height="195" rx="6"/>
    <!-- Border -->
    <rect fill="none" stroke="url(#ring_grad)" stroke-width="1.5" x="0.75" y="0.75" width="493.5" height="193.5" rx="5.5"/>

    <!-- Vertical dividers -->
    <line x1="165" y1="24" x2="165" y2="171" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="330" y1="24" x2="330" y2="171" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.35"/>

    <!-- ── LEFT: Total Contributions ── -->
    <text x="82" y="44" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="700" fill="#8B949E">Total Contributions</text>
    <text x="82" y="106" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="40" font-weight="700" fill="#58A6FF" filter="url(#glow)">2,847</text>
    <text x="82" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11" fill="#484f58">Aug 6, 2015 – Apr 29, 2026</text>

    <!-- ── CENTER: Current Streak ── -->
    <text x="247" y="44" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="700" fill="#8B949E">Current Streak</text>
    <!-- flame -->
    <text x="247" y="82" text-anchor="middle" font-size="26">🔥</text>
    <text x="247" y="122" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="40" font-weight="700" fill="#FF6E6E" filter="url(#glow)">47</text>
    <text x="247" y="143" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#FF6E6E">days</text>
    <text x="247" y="162" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11" fill="#484f58">Mar 13 – Apr 29, 2026</text>

    <!-- ── RIGHT: Longest Streak ── -->
    <text x="413" y="44" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="700" fill="#8B949E">Longest Streak</text>
    <text x="413" y="106" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="40" font-weight="700" fill="#58A6FF" filter="url(#glow)">89</text>
    <text x="413" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11" fill="#484f58">Nov 12, 2025 – Feb 8, 2026</text>
  </g>
</svg>
