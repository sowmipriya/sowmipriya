<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>

    <!-- repeating floral tile -->
    <pattern id="floral" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">

      <!-- 5-petal flower centred in tile -->
      <g transform="translate(30,30)">
        <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#1c3a5c" stroke="#58A6FF" stroke-width="0.7" transform="rotate(0)"/>
        <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#1c3a5c" stroke="#58A6FF" stroke-width="0.7" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#1c3a5c" stroke="#58A6FF" stroke-width="0.7" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#1c3a5c" stroke="#58A6FF" stroke-width="0.7" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="4" ry="8" fill="#1c3a5c" stroke="#58A6FF" stroke-width="0.7" transform="rotate(288)"/>
        <circle cx="0" cy="0" r="3.5" fill="#58A6FF" opacity="0.9"/>
        <circle cx="0" cy="0" r="1.5" fill="#c9d1d9"/>
      </g>

      <!-- two small leaves at opposite corners to create vine feel when tiled -->
      <path d="M6,6 Q14,2 14,10 Q6,14 6,6Z"   fill="#1e4d3a" stroke="#3a7d6e" stroke-width="0.6"/>
      <path d="M54,54 Q46,58 46,50 Q54,46 54,54Z" fill="#1e4d3a" stroke="#3a7d6e" stroke-width="0.6"/>

      <!-- tiny connecting dots -->
      <circle cx="30" cy="6"  r="1" fill="#3a7d6e" opacity="0.5"/>
      <circle cx="30" cy="54" r="1" fill="#3a7d6e" opacity="0.5"/>
      <circle cx="6"  cy="30" r="1" fill="#3a7d6e" opacity="0.5"/>
      <circle cx="54" cy="30" r="1" fill="#3a7d6e" opacity="0.5"/>
    </pattern>

    <!-- radial fade: dark in centre so text pops, pattern visible on sides -->
    <radialGradient id="rfade" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0.96"/>
      <stop offset="55%"  stop-color="#0d1117" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.15"/>
    </radialGradient>

  </defs>

  <!-- base -->
  <rect width="900" height="200" fill="#0d1117"/>

  <!-- floral pattern -->
  <rect width="900" height="200" fill="url(#floral)" opacity="0.55"/>

  <!-- centre fade so text reads clearly -->
  <rect width="900" height="200" fill="url(#rfade)"/>

  <!-- name -->
  <text x="450" y="90" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="34" font-weight="bold" letter-spacing="1.5" fill="#e6edf3">
    Sowmipriya Rajendiran
  </text>

  <!-- subtitle -->
  <text x="450" y="120" text-anchor="middle"
        font-family="'Segoe UI',Ubuntu,sans-serif"
        font-size="13" letter-spacing="2.5" fill="#6e7681">
    AI/ML ENGINEER  •  LLM BUILDER  •  DEVELOPER
  </text>

  <!-- thin rule -->
  <line x1="310" y1="141" x2="590" y2="141" stroke="#30363d" stroke-width="1"/>
</svg>
