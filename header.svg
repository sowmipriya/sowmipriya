<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.2"  stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="0.8"  stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sway  { animation: sway 8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
      .sway2 { animation: sway 8s ease-in-out 2s infinite; transform-box: fill-box; transform-origin: bottom center; }
      @keyframes sway {
        0%,100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg);  }
      }
    </style>
  </defs>

  <rect width="900" height="200" fill="#0d1117"/>

  <!-- ── LEFT ── -->
  <g stroke="#58A6FF" fill="none" stroke-linecap="round" opacity="0.5">
    <!-- main stem -->
    <path d="M60,200 Q65,150 75,110 Q85,70 80,40" stroke-width="1.2"/>
    <!-- branch -->
    <path d="M75,110 Q55,90 45,70" stroke-width="1"/>
    <!-- leaves -->
    <path d="M70,155 Q50,145 48,128 Q65,135 70,155Z" fill="#58A6FF" opacity="0.15" stroke-width="0.8"/>
    <path d="M77,95  Q95,82  98,65  Q82,75  77,95 Z" fill="#58A6FF" opacity="0.12" stroke-width="0.8"/>
    <!-- main flower -->
    <g transform="translate(80,40)" class="sway">
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(0)"   stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(72)"  stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(144)" stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(216)" stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(288)" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#58A6FF" opacity="0.4" stroke="none"/>
    </g>
    <!-- small flower on branch -->
    <g transform="translate(45,70)" class="sway2">
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(0)"   stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(72)"  stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(144)" stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(216)" stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(288)" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#58A6FF" opacity="0.35" stroke="none"/>
    </g>
    <!-- dots -->
    <circle cx="90"  cy="120" r="1.5" fill="#58A6FF" stroke="none" opacity="0.35"/>
    <circle cx="58"  cy="130" r="1"   fill="#58A6FF" stroke="none" opacity="0.3"/>
    <circle cx="100" cy="75"  r="1"   fill="#58A6FF" stroke="none" opacity="0.3"/>
  </g>

  <!-- ── RIGHT (mirror) ── -->
  <g stroke="#58A6FF" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M840,200 Q835,150 825,110 Q815,70 820,40" stroke-width="1.2"/>
    <path d="M825,110 Q845,90 855,70" stroke-width="1"/>
    <path d="M830,155 Q850,145 852,128 Q835,135 830,155Z" fill="#58A6FF" opacity="0.15" stroke-width="0.8"/>
    <path d="M823,95  Q805,82  802,65  Q818,75  823,95 Z" fill="#58A6FF" opacity="0.12" stroke-width="0.8"/>
    <g transform="translate(820,40)" class="sway2">
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(0)"   stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(72)"  stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(144)" stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(216)" stroke-width="1"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="10" transform="rotate(288)" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#58A6FF" opacity="0.4" stroke="none"/>
    </g>
    <g transform="translate(855,70)" class="sway">
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(0)"   stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(72)"  stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(144)" stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(216)" stroke-width="0.9"/>
      <ellipse cx="0" cy="-9" rx="3" ry="7" transform="rotate(288)" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#58A6FF" opacity="0.35" stroke="none"/>
    </g>
    <circle cx="810" cy="120" r="1.5" fill="#58A6FF" stroke="none" opacity="0.35"/>
    <circle cx="842" cy="130" r="1"   fill="#58A6FF" stroke="none" opacity="0.3"/>
    <circle cx="800" cy="75"  r="1"   fill="#58A6FF" stroke="none" opacity="0.3"/>
  </g>

  <!-- centre fade -->
  <rect width="900" height="200" fill="url(#fade)"/>

  <!-- text -->
  <text x="450" y="90" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="34" font-weight="bold" letter-spacing="1.5" fill="#e6edf3">
    Sowmipriya Rajendiran
  </text>
  <text x="450" y="120" text-anchor="middle"
        font-family="'Segoe UI',Ubuntu,sans-serif"
        font-size="13" letter-spacing="2.5" fill="#6e7681">
    AI/ML ENGINEER  •  LLM BUILDER  •  DEVELOPER
  </text>
  <line x1="330" y1="140" x2="570" y2="140" stroke="#21262d" stroke-width="1"/>
</svg>
